# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: gosloplint

builds:
  # No ldflags version variables: the multichecker answers -V=full (which
  # `go vet -vettool` requires) from the build info Go embeds.
  - id: gosloplint
    main: ./cmd/gosloplint
    binary: gosloplint
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^.*?(docs|chore|ci|test)(\(.+\))??!?:.+$'
