version: "2"

linters:
  default: none
  enable:
    - gosloplint
  settings:
    custom:
      gosloplint:
        type: module
        description: Reports AI slop that compiles and passes its tests.
        settings:
          disable: [testhelper]
          comment:
            limits:
              inline: 3
          dupl:
            exempt: ["*_gen.go"]
          emptyid:
            suffixes: [id, ids, key, keys, name, ref]
          fileplace:
            enable: [typefile]
          steer:
            recursion-packages: ["..."]
          vocab:
            words: [legacy client]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # steer can report several checks at one position.
  uniq-by-line: false
